data:
  input_file: "Net_generation_United_States_all_sectors_monthly_ml-ready.csv"
  date_col: "Month"
  value_col: "all fuels (utility-scale) thousand megawatthours"
  frequency: "M"

experiment:
  history_end: "2024-12-01"
  forecast_start: "2025-01-01"
  forecast_end: "2025-08-01"

model:
  checkpoint: "google/timesfm-1.0-200m-pytorch"
  backend: "cpu"
  per_core_batch_size: 32
  context_length: 512
  horizon_length: 8

output:
  tufte_plot: "timesfm_tufte.png"
  output_dir: "outputs"
