data:
  input_file: "Net_generation_United_States_all_sectors_monthly_ml-ready.csv"
  date_col: "Month"
  value_col: "all fuels (utility-scale) thousand megawatthours"
  resample_rule: null
  frequency: "MS"

model:
  huggingface_model: "amazon/chronos-t5-tiny"
  prediction_length: 8
  context_length: null
  num_samples: 100
  device_map: "cpu"
  torch_dtype: "float32"

plotting:
  tufte:
    history_start: "2024-01-01"
    history_end: "2024-12-01"
    actual_start: "2025-01-01"
    actual_end: "2025-08-01"
    output_plot: "chronos_tufte.png"
  forecast:
    title: "Chronos Forecast"
    output_plot: "chronos_forecast.png"
