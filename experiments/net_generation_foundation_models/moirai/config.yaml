data:
  input_file: "Net_generation_United_States_all_sectors_monthly_ml-ready.csv"
  date_col: "Month"
  value_col: "all fuels (utility-scale) thousand megawatthours"
  freq: "MS"

experiment:
  history_end: "2024-12-01"
  forecast_start: "2025-01-01"
  forecast_end: "2025-08-01"

model:
  checkpoint: "ibm-granite/granite-timeseries-ttm-r2"
  context_length: 512
  horizon: 8
  num_samples: 100

output:
  tufte_plot: "granite_ttm_tufte.png"
  output_dir: "outputs"
