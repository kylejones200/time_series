# Enhanced Plotting Configuration Example
# This is an example of the enhanced config structure for more granular plot control

data:
  input_file: "data/reference/example_series.csv"
  date_col: "date"
  value_col: "value"

model:
  type: "arima"
  order: [1, 1, 1]
  random_state: 42

preprocessing:
  standardize: false
  remove_outliers: false

# Enhanced plotting configuration
plotting:
  style:
    # Control which plot borders (spines) are visible
    spines:
      top: false      # Hide top border (cleaner look)
      right: false    # Hide right border (cleaner look)
      bottom: true    # Show bottom border
      left: true      # Show left border
    
    # Grid settings
    grid: false       # Set to true to show grid with 30% opacity
    
    # Legend styling
    legend:
      frameon: false  # Legend without frame (minimalist)
      loc: "best"     # Automatic best location
      # Other options: "upper right", "lower left", "center", etc.
    
    # Figure settings
    figure:
      figsize: [12, 6]  # [width, height] in inches
      dpi: 150          # Resolution for saved figures
    
    # Color palette
    colors:
      primary: "k"      # Primary color (black)
      secondary: "r"    # Secondary color (red)
      accent: "b"       # Accent color (blue)
      background: "w"   # Background color (white)
      # Can also use hex codes: "#1f77b4", "#ff7f0e"
      # Or named colors: "navy", "crimson", "forestgreen"
    
    # Line and marker styling
    linewidth: 1.5     # Line width for plots
    markersize: 4      # Marker size for scatter plots
    alpha: 0.7         # Transparency (0.0 to 1.0)
  
  # Show plot after saving
  show_plot: true

output:
  plot_format: "png"   # Format: "png", "pdf", "svg", etc.
  save_plots: true
  output_dir: "outputs"

