data:
  input_file: "/Users/kylejonespatricia/time_series/data/morocco_daily_total_load.csv"
  date_col: "date"
  value_col: "value"

model:
  type: "InceptionTime"
  train_size: 0.8
  batch_size: 64
  n_epochs: 10
  lr: 0.001

plotting:
  style:
    spines:
      top: false
      right: false
      bottom: true
      left: true
    grid: false
    legend:
      frameon: false
      loc: "best"
    figure:
      figsize: [12, 6]
      dpi: 150
    colors:
      primary: "k"
      secondary: "r"
      accent: "b"
    linewidth: 1.5
    markersize: 4
    alpha: 0.7

output:
  plot_format: "png"
  save_plots: true
  output_dir: "outputs"

