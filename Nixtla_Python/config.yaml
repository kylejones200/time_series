data:
  input_file: "input.csv"
  date_col: "date"
  value_col: "value"
  unique_id: "series1"

model:
  models: ["AutoARIMA"]
  freq: "D"
  forecast_horizon: 12
  n_jobs: 1

# Hierarchical forecasting (optional)
hierarchical:
  enabled: false  # Set to true to use HierarchicalForecast
  structure: null  # Define hierarchy, e.g., {"Total": ["A", "B"], "A": ["A1", "A2"]}
  visualize: true
  visualize_levels: []  # List of levels to visualize

plotting:
  style:
    spines:
      top: false
      right: false
      bottom: true
      left: true
    grid: false
    legend:
      frameon: false
      loc: "best"
    figure:
      figsize: [12, 6]
      dpi: 150
    colors:
      primary: "k"
      secondary: "r"
      accent: "b"
    linewidth: 1.5
    markersize: 4
    alpha: 0.7

output:
  plot_format: "png"
  save_plots: true
  output_dir: "outputs"

