data:
  input_file: "amtrak_ridership_time_series_data.csv"
  date_col: "Year"
  value_col: "Ridership"
  frequency: "A"  # pandas offset alias (e.g. "M", "W", "D", "H")

model:
  prediction_length: 5
  checkpoint: "google/timesfm-2.0-500m-pytorch"
  per_core_batch_size: 32
  input_patch_len: 32
  output_patch_len: 128
  horizon_len: 128
  num_layers: 50
  model_dims: 1280
  use_positional_embedding: false
  forecast_column: "timesfm"
