data:
  input_file: "input.csv"
  date_col: "date"
  value_col: "value"
  test_size: 0.2

model:
  method: "parametric"  # Options: "bootstrap", "parametric"
  arima_order: [2, 1, 2]  # [p, d, q]
  n_bootstrap: 100  # Number of bootstrap samples (if method is bootstrap)
  alpha: 0.05  # Significance level (95% CI)

plotting:
  style:
    spines:
      top: false
      right: false
      bottom: true
      left: true
    grid: false
  legend:
    frameon: false
    loc: "best"
  figure_size: [15, 6]
  dpi: 150
  colors:
    - "k"
    - "g"
    - "r"
  linewidth: 2
  markersize: 4
  alpha: 0.7

plot_titles:
  confidence_intervals: "Forecast with Confidence Intervals"

