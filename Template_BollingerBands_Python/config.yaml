data:
  input_file: "input.csv"
  date_col: "date"
  value_col: "value"

model:
  window: 20  # Moving average window
  num_std: 2  # Number of standard deviations

plotting:
  style:
    spines:
      top: false
      right: false
      bottom: true
      left: true
    grid: false
  legend:
    frameon: false
    loc: "best"
  figure_size: [15, 6]
  dpi: 150
  colors:
    - "k"
    - "b"
  linewidth: 2
  markersize: 4
  alpha: 0.7

plot_titles:
  bollinger_bands: "Bollinger Bands"

