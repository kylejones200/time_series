data:
  input_file: "Net_generation_United_States_all_sectors_monthly.csv"
  date_col: "date"
  value_col: "value"
  frequency: "M"

experiment:
  history_end: "2024-12-01"
  forecast_start: "2025-01-01"
  forecast_end: "2025-08-01"

model:
  checkpoint: "google/timesfm-1.0-200m-pytorch"
  backend: "cpu"
  per_core_batch_size: 32
  context_length: 512
  horizon_length: 8

output:
  tufte_plot: "eia_timesfm_last_fold.png"
  output_dir: "outputs"
