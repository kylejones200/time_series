data:
  input_file: "Net_generation_United_States_all_sectors_monthly.csv"
  date_col: "date"
  value_col: "value"
  freq: "MS"

clustering:
  n_clusters: 3
  distance: "dtw"
  season_length: 12

plotting:
  colors:
    clusters: ["#1f77b4", "#ff7f0e", "#2ca02c"]
    history: "#888888"
    actual: "#444444"
  figsize: [16, 10]
  dpi: 150

output:
  cluster_summary_plot: "eia_aeon_ts_clusters.png"
  output_dir: "outputs"

