# ReadTheDocs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/sphinx/conf.py
  builder: html

python:
  install:
    - requirements: docs/requirements.txt

formats:
  - htmlzip
  - pdf

