data:
  input_file: "reference/example_series.csv"
  date_column: "date"
  value_column: "value"

model:
  kernel_type: "rbf_matern"  # Options: "rbf", "matern", "rbf_matern"
  alpha: 0.1                  # Noise level (regularization)
  n_restarts: 3               # Number of optimizer restarts
  random_state: 42

evaluation:
  test_size: 0.2
  forecast_horizon: 24        # Forecast steps ahead

output:
  output_dir: "outputs"
  plot_file: "gp_forecast.png"
  forecast_file: "gp_forecast.csv"
  metrics_file: "gp_metrics.csv"
  dpi: 300

