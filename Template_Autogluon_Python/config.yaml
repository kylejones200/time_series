data:
  input_file: "amtrak_ridership_time_series_data.csv"
  date_col: "Year"
  value_col: "Ridership"
  item_id_col: null
  default_item_id: "amtrak"
  frequency: "A"

model:
  prediction_length: 5
  holdout_length: 5
  model_path: "autogluon_model"
  eval_metric: "MAPE"
  presets: "fast_training"
  hyperparameters: {}
  num_val_windows: 1
  save_leaderboard: true

plotting:
  style:
    spines:
      top: false
      right: false
      bottom: true
      left: true
    grid: false
  legend:
    frameon: false
    loc: "best"
  figure_size: [15, 6]
  dpi: 150
  colors:
    - "k"
    - "g"
    - "r"
  linewidth: 2
  markersize: 3
  alpha: 0.7

plot_titles:
  autogluon_forecast: "AutoGluon Time Series Forecast"

